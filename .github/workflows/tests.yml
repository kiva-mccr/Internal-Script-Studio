name: Tests

# Every pull request runs the tests, even a docs-only one: the main branch's ruleset requires this check, and a
# skipped check would leave the pull request waiting forever. Pushes to main still skip docs-only changes.
on:
  pull_request:
  push:
    branches: [main]
    paths-ignore: ['**.md', 'docs/**']

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with: { node-version: 22, cache: npm }
      - run: npm ci
      - run: npm run check
      - run: npm test
      - run: npx playwright install --with-deps chromium
      # The app's own font (Inter), so a test that measures the top bar sees what the app is drawn for (AP-16).
      - run: sudo apt-get install -y --no-install-recommends fonts-inter
      - run: npm run e2e
